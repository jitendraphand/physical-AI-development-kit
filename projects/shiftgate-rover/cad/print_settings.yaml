# Per-part print settings for the ShiftGate Rover.
# Material: PLA, 1.75 mm, 0.4 mm nozzle, bed 60 °C, nozzle 210 °C unless noted.
# Mass "solid_g" is the watertight CAD volume × 1.24 g/cm³ (upper bound).
# "typical_sliced_g" is a Cura/PrusaSlicer-style estimate at the listed infill.
# Times assume 50 mm/s perimeters, 40 mm/s infill, 0.4 mm nozzle, no extreme
# acceleration.  Verify with your slicer; they vary ±30 %.
# Generated from cad/stl (trimesh), 13 Nov 2026.

common:
  material: PLA
  filament_diameter_mm: 1.75
  nozzle_mm: 0.4
  nozzle_temp_c: 210
  bed_temp_c: 60
  cooling: 100% after the first two layers

parts:
  chassis_base:
    qty: 1
    layer_height_mm: 0.20
    infill_pct: 30
    infill_pattern: gyroid
    walls: 3
    top_bottom_layers: 4
    supports: none
    orientation: "Floor on the bed, motor pockets facing up."
    solid_g: 61.17
    typical_sliced_g: 52
    time_estimate: "3.5–5.0 h"
  motor_clamp:
    qty: 2
    layer_height_mm: 0.16
    infill_pct: 30
    walls: 3
    supports: none
    orientation: "Flat, recess facing up."
    solid_g: 0.40
    typical_sliced_g: 0.4
    time_estimate: "8–12 min each"
  wheel:
    qty: 2
    layer_height_mm: 0.16
    infill_pct: 20
    walls: 4
    top_bottom_layers: 5
    supports: none
    orientation: "One face on the bed (the wheel is designed to print flat).  Do not print on the tread."
    notes: "Stretch a wide rubber band into the groove for traction."
    solid_g: 13.18
    typical_sliced_g: 8.5
    time_estimate: "50–75 min each"
  caster_cup:
    qty: 1
    layer_height_mm: 0.16
    infill_pct: 30
    walls: 3
    supports: none
    orientation: "Retention opening on the bed so the spherical cavity prints as a supported overhang."
    solid_g: 1.00
    typical_sliced_g: 1.0
    time_estimate: "15–20 min"
  sensor_bracket_us:
    qty: 1
    layer_height_mm: 0.20
    infill_pct: 20
    walls: 3
    supports: none
    orientation: "Flat, pocket up."
    solid_g: 2.86
    typical_sliced_g: 2.5
    time_estimate: "20–30 min"
  sensor_bracket_ir:
    qty: 2
    layer_height_mm: 0.20
    infill_pct: 20
    walls: 3
    supports: none
    orientation: "Foot on the bed, upright rising."
    notes: "A 2–3 mm brim helps the small foot stay put."
    solid_g: 1.49
    typical_sliced_g: 1.3
    time_estimate: "15–25 min each"
  electronics_cover:
    qty: 1
    layer_height_mm: 0.20
    infill_pct: 15
    walls: 2
    supports: none
    orientation: "Top of the cover on the bed (open face up) so the walls print as perimeters."
    solid_g: 15.74
    typical_sliced_g: 12
    time_estimate: "1.0–1.5 h"
  battery_retainer:
    qty: 1
    layer_height_mm: 0.20
    infill_pct: 20
    walls: 3
    supports: none
    orientation: "Strap flat on the bed, hooks up."
    solid_g: 2.71
    typical_sliced_g: 2.5
    time_estimate: "15–20 min"
  wall_clip:
    qty: 24
    layer_height_mm: 0.20
    infill_pct: 15
    walls: 2
    supports: none
    orientation: "Base on the bed.  Pack as many as will fit; one 220 mm plate holds ~16."
    solid_g: 3.48
    typical_sliced_g: 3.0
    time_estimate: "15 min each, ~3–4 h for 24 on two plates"
  wall_post:
    qty: 12
    layer_height_mm: 0.20
    infill_pct: 15
    walls: 3
    supports: none
    orientation: "Standing, slots vertical (the 14×14 face on the bed)."
    solid_g: 5.66
    typical_sliced_g: 4.0
    time_estimate: "25–35 min each, ~4–5 h for 12"
  wall_segment:
    qty: 0
    optional: true
    layer_height_mm: 0.20
    infill_pct: 20
    walls: 3
    supports: none
    orientation: "Largest face on the bed (176×50).  Optional — 5 mm foam board is cheaper."
    solid_g: 43.65
    typical_sliced_g: 30
    time_estimate: "2.0–2.5 h each"
  gate_segment:
    qty: 1
    layer_height_mm: 0.20
    infill_pct: 20
    walls: 3
    supports: "Touching buildplate only, if the flag overhangs; otherwise none."
    orientation: "Wall face on the bed, handle pointing up."
    notes: "Print in a contrasting colour (orange / red) so the gate is obvious."
    solid_g: 46.02
    typical_sliced_g: 32
    time_estimate: "2.0–2.5 h"
  alignment_jig:
    qty: 1
    layer_height_mm: 0.20
    infill_pct: 20
    walls: 3
    supports: none
    orientation: "Largest face on the bed so the 24 mm shaft hole is horizontal."
    solid_g: 15.85
    typical_sliced_g: 9
    time_estimate: "50–70 min"

kit_totals:
  default_qty_solid_g_upper_bound: 327
  default_qty_typical_sliced_g: 250
  typical_filament_cost_inr: "≈ ₹175–250 of a 1 kg PLA roll (₹600–800/kg, India, 2026)"
  typical_total_print_time_h: "14–18 h including arena clips and posts"
