[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftgate-core"
version = "1.0.0"
description = "Witnessed-occupancy mapping, A* planning, and discrepancy-triggered replanning for the ShiftGate Rover."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jitendra Phand" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["shiftgate_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
